<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JJ Performance</title>
<meta name="description" content="Treino, evolução e coach de Jiu-Jítsu com periodização de 16 semanas.">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c8a96e">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<!-- iOS (adiciona à tela de início, modo standalone) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JJ Performance">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#08080e;--surface:#111118;--surface2:#18181f;
  --glass:rgba(255,255,255,0.045);--glass2:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.07);--border-glow:rgba(200,169,110,0.2);
  --gold:#c8a96e;--gold-bright:#e8c88e;--gold-dim:rgba(200,169,110,0.10);
  --ember:#e55a2b;--ember-dim:rgba(229,90,43,0.10);
  --text:#f0ede8;--text2:#7a7a8a;--text3:#4a4a5a;
  --green:#4ade80;--red:#f87171;--yellow:#fbbf24;
  --r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:28px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;line-height:1.5;overscroll-behavior:none;}
body{display:flex;flex-direction:column;align-items:center;}
#app{width:100%;max-width:540px;min-height:100vh;position:relative;padding-bottom:100px;}
.screen{display:none;padding:16px 16px 110px;}
.screen.active{display:block;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:0 1px 1px rgba(0,0,0,.9),0 4px 8px rgba(0,0,0,.7),0 12px 24px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04) inset;
  position:relative;overflow:hidden;margin-bottom:12px;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--belt-grad,linear-gradient(90deg,#e8e8e8,#b8b8c8));}
.card-inner{padding:16px;}
.card-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:10px;}
.glass{background:rgba(17,17,24,.85);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--border);}

/* NAV PILL */
.nav-pill{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:rgba(17,17,24,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:999px;padding:6px;
  display:flex;gap:2px;box-shadow:0 8px 32px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.6);
  z-index:1000;width:calc(100% - 32px);max-width:480px;}
.nav-item{flex:1;padding:8px 4px;border-radius:999px;display:flex;flex-direction:column;
  align-items:center;gap:2px;cursor:pointer;transition:all .25s ease;position:relative;z-index:1;border:none;background:none;}
.nav-icon{width:20px;height:20px;color:var(--text3);transition:color .25s;}
.nav-label{font-size:10px;font-weight:600;color:var(--text3);transition:color .25s;white-space:nowrap;}
.nav-item.active .nav-icon{color:var(--gold);}
.nav-item.active .nav-label{color:var(--gold);}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 20px;border-radius:var(--r-md);font-family:inherit;font-weight:700;
  font-size:14px;cursor:pointer;border:none;transition:all .2s;}
.btn-gold{background:var(--gold);color:#08080e;}
.btn-gold:hover{background:var(--gold-bright);}
.btn-outline{background:transparent;border:1px solid var(--border-glow);color:var(--gold);}
.btn-outline:hover{background:var(--gold-dim);}
.btn-full{width:100%;}
.btn-video{display:inline-flex;align-items:center;gap:5px;background:var(--gold-dim);
  border:1px solid rgba(200,169,110,.2);color:var(--gold);font-size:11px;font-weight:600;
  padding:4px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;font-family:inherit;}

/* BOTTOM SHEET */
.bottom-sheet{position:fixed;bottom:-100%;left:0;right:0;background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;border-top:1px solid var(--border);
  padding:12px 20px 40px;z-index:2000;transition:bottom .4s cubic-bezier(.4,0,.2,1);
  max-height:85vh;overflow-y:auto;}
.bottom-sheet.open{bottom:0;}
.sheet-handle{width:36px;height:4px;background:var(--text3);border-radius:2px;margin:0 auto 16px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);opacity:0;pointer-events:none;
  transition:opacity .3s;z-index:1900;}
.overlay.active{opacity:1;pointer-events:all;}

/* HEADER */
.app-header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px;}
.app-logo{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-.02em;}
.app-logo span{color:var(--gold);}
.icon-btn{width:38px;height:38px;border-radius:var(--r-sm);background:var(--surface2);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;}

/* TAGS / BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;}
.badge-gold{background:var(--gold-dim);color:var(--gold);border:1px solid var(--border-glow);}
.badge-green{background:rgba(74,222,128,.1);color:var(--green);}
.badge-red{background:rgba(248,113,113,.1);color:var(--red);}
.badge-ember{background:var(--ember-dim);color:var(--ember);}

/* ACWR BAR */
.acwr-bar-wrap{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden;margin:8px 0;}
.acwr-bar-fill{height:100%;border-radius:999px;transition:width .6s ease;}
.acwr-zones{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);}

/* FORM ELEMENTS */
input,textarea,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  font-family:inherit;font-size:14px;padding:10px 12px;border-radius:var(--r-md);width:100%;outline:none;
  transition:border-color .2s;}
input:focus,textarea:focus,select:focus{border-color:var(--gold);}
label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px;}
.form-group{margin-bottom:14px;}
select option{background:var(--surface2);}

/* SEGMENTED */
.seg-ctrl{display:flex;background:var(--surface2);border-radius:var(--r-md);padding:3px;gap:2px;margin-bottom:16px;}
.seg-btn{flex:1;padding:7px 8px;border-radius:calc(var(--r-md) - 2px);font-family:inherit;font-weight:600;
  font-size:12px;cursor:pointer;border:none;color:var(--text2);background:transparent;transition:all .2s;}
.seg-btn.active{background:var(--surface);color:var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.4);}

/* EXERCISE ROW */
.ex-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
.ex-row:last-child{border-bottom:none;}
.ex-num{width:26px;height:26px;background:var(--gold-dim);border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700;color:var(--gold);flex-shrink:0;margin-top:1px;}
.ex-main{flex:1;min-width:0;}
.ex-name{font-weight:700;font-size:14px;color:var(--text);margin-bottom:2px;}
.ex-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.ex-tag{font-size:11px;color:var(--text2);background:var(--surface2);padding:2px 7px;border-radius:999px;}
.ex-tip{font-size:12px;color:var(--text2);margin-bottom:3px;}
.ex-jj{font-size:11px;color:var(--gold);opacity:.8;display:flex;align-items:center;gap:4px;}

/* DAY STRIP */
.day-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:16px;}
.day-strip::-webkit-scrollbar{display:none;}
.day-btn{flex-shrink:0;width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 0;border-radius:var(--r-md);background:var(--surface2);border:1px solid var(--border);
  cursor:pointer;transition:all .2s;font-family:inherit;}
.day-btn.active{background:var(--gold-dim);border-color:var(--border-glow);}
.day-btn .day-letter{font-size:12px;font-weight:700;color:var(--text2);}
.day-btn.active .day-letter{color:var(--gold);}
.day-btn .day-icon{font-size:16px;}
.day-btn .day-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);}
.day-btn.active .day-dot{background:var(--gold);}

/* PROGRESS BAR */
.prog-bar-wrap{background:var(--surface2);border-radius:999px;height:6px;overflow:hidden;}
.prog-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold-bright));}

/* SCORE RING */
.score-ring-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 0;}
.score-ring-wrap svg{overflow:visible;}
.score-center{font-size:42px;font-weight:800;fill:var(--text);}
.score-sub{font-size:13px;fill:var(--text2);}

/* ZONE BARS */
.zone-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
.zone-color{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
.zone-name{font-size:12px;color:var(--text2);width:90px;flex-shrink:0;}
.zone-range{font-size:12px;font-weight:600;color:var(--text);margin-left:auto;}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;}
.msg-user{align-self:flex-end;max-width:80%;background:var(--gold-dim);border:1px solid var(--border-glow);
  border-radius:var(--r-lg) var(--r-lg) 4px var(--r-lg);padding:10px 14px;font-size:14px;color:var(--text);}
.msg-ai{align-self:flex-start;max-width:85%;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 4px;padding:10px 14px;font-size:14px;color:var(--text);}
.msg-thinking{align-self:flex-start;display:flex;gap:4px;padding:12px 16px;}
.dot-pulse{width:7px;height:7px;border-radius:50%;background:var(--text3);animation:pulse 1.2s infinite;}
.dot-pulse:nth-child(2){animation-delay:.2s;}
.dot-pulse:nth-child(3){animation-delay:.4s;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%,80%,100%{opacity:.3;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}
.chat-input-row{display:flex;gap:8px;margin-top:8px;}
.chat-input-row input{flex:1;}
.chat-send{width:44px;height:44px;border-radius:var(--r-md);background:var(--gold);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* TIMER */
.timer-display{font-size:72px;font-weight:800;text-align:center;letter-spacing:-.04em;
  background:linear-gradient(135deg,var(--text),var(--gold));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.round-dots{display:flex;justify-content:center;gap:8px;margin:12px 0;}
.round-dot{width:10px;height:10px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);}
.round-dot.done{background:var(--gold);}
.round-dot.active{background:var(--ember);box-shadow:0 0 8px var(--ember);}
.pse-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0;}
.pse-btn{aspect-ratio:1;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--border);
  font-family:inherit;font-weight:700;font-size:16px;color:var(--text2);cursor:pointer;transition:all .2s;}
.pse-btn:hover,.pse-btn.selected{background:var(--gold-dim);border-color:var(--border-glow);color:var(--gold);}

/* PROFILE MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:3000;display:flex;
  align-items:flex-end;justify-content:center;}
.modal-sheet{background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;
  border-top:1px solid var(--border);padding:20px 20px 40px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:22px;font-weight:800;margin-bottom:4px;color:var(--text);}
.modal-sub{font-size:14px;color:var(--text2);margin-bottom:20px;}

/* ASSESSMENT */
.assess-ref{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0;}
.assess-col{text-align:center;padding:6px 4px;border-radius:var(--r-sm);font-size:10px;}
.assess-col .val{font-weight:700;font-size:12px;margin-bottom:2px;}
.assess-col.poor{background:rgba(248,113,113,.1);color:var(--red);}
.assess-col.reg{background:rgba(251,191,36,.1);color:var(--yellow);}
.assess-col.good{background:rgba(74,222,128,.1);color:var(--green);}
.assess-col.exc{background:rgba(200,169,110,.1);color:var(--gold);}
.result-bar-wrap{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden;margin:6px 0;}
.result-bar{height:100%;border-radius:999px;transition:width .8s ease;}

/* ANALYSIS */
.analysis-step{display:flex;align-items:center;gap:10px;padding:8px 0;}
.step-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.step-icon.done{background:rgba(74,222,128,.2);color:var(--green);}
.step-icon.active{background:var(--gold-dim);color:var(--gold);}
.step-icon.pending{background:var(--surface2);color:var(--text3);}
.step-text{font-size:13px;color:var(--text2);}
.step-text.done{color:var(--text);}

/* UTILS */
.flex{display:flex;}.flex-col{flex-direction:column;}.gap-8{gap:8px;}.gap-12{gap:12px;}
.items-center{align-items:center;}.justify-between{justify-content:space-between;}
.mt-4{margin-top:4px;}.mt-8{margin-top:8px;}.mt-12{margin-top:12px;}.mt-16{margin-top:16px;}
.mb-4{margin-bottom:4px;}.mb-8{margin-bottom:8px;}.mb-12{margin-bottom:12px;}
.text-gold{color:var(--gold);}.text-muted{color:var(--text2);}.text-sm{font-size:13px;}
.fw-700{font-weight:700;}.fw-800{font-weight:800;}
.divider{height:1px;background:var(--border);margin:12px 0;}
.section-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-box{background:var(--surface2);border-radius:var(--r-md);padding:12px;border:1px solid var(--border);}
.stat-val{font-size:24px;font-weight:800;color:var(--text);}
.stat-label{font-size:11px;color:var(--text2);margin-top:2px;}

/* TECHNIQUE CARD */
.tech-card{background:var(--surface2);border-radius:var(--r-md);padding:12px;border:1px solid var(--border);margin-bottom:8px;}
.tech-name{font-weight:700;font-size:14px;margin-bottom:4px;}
.tech-desc{font-size:12px;color:var(--text2);margin-bottom:6px;}
.tech-plan{font-size:12px;color:var(--gold);}

/* POLAR */
.polar-step{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.polar-step:last-child{border-bottom:none;}
.polar-step-num{width:28px;height:28px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--border-glow);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--gold);flex-shrink:0;}
.polar-step-body strong{font-size:13px;color:var(--text);display:block;margin-bottom:2px;}
.polar-step-body p{font-size:12px;color:var(--text2);}

/* CATEGORY CARD */
.cat-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.cat-row:last-child{border-bottom:none;}
.cat-name{font-weight:600;font-size:14px;}
.cat-range{font-size:13px;color:var(--text2);}
.cat-row.target{background:var(--gold-dim);border-radius:var(--r-sm);padding:10px 10px;border:1px solid var(--border-glow);}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* DELOAD BANNER */
.deload-banner{background:linear-gradient(135deg,rgba(229,90,43,.08),rgba(229,90,43,.04));
  border:1px solid rgba(229,90,43,.2);border-radius:var(--r-md);padding:10px 14px;
  font-size:13px;color:var(--ember);display:flex;align-items:center;gap:8px;margin-bottom:12px;}

/* COACH BUBBLE */
.coach-card{display:flex;gap:12px;align-items:flex-start;background:var(--surface2);
  border-radius:var(--r-lg);border:1px solid var(--border);padding:14px;margin-bottom:12px;}
.coach-avatar{width:36px;height:36px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--border-glow);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.coach-text{font-size:13px;color:var(--text2);line-height:1.6;}
.coach-text strong{color:var(--text);display:block;margin-bottom:2px;}

/* REGISTER MODAL */
.pse-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:10px 0;}
.pse-chip{padding:8px 12px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--border);
  font-family:inherit;font-weight:700;font-size:14px;color:var(--text2);cursor:pointer;transition:all .15s;min-width:44px;text-align:center;}
.pse-chip.sel{background:var(--gold-dim);border-color:var(--border-glow);color:var(--gold);}
</style>
</head>
<body>
<div id="app">
  <!-- SCREENS -->
  <div id="sc-hoje" class="screen active"></div>
  <div id="sc-treino" class="screen"></div>
  <div id="sc-evolucao" class="screen"></div>
  <div id="sc-comp" class="screen"></div>
  <div id="sc-ia" class="screen"></div>

  <!-- NAV PILL -->
  <nav class="nav-pill" id="navPill">
    <button class="nav-item active" onclick="goTab('hoje')" id="nav-hoje">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      <span class="nav-label">Hoje</span>
    </button>
    <button class="nav-item" onclick="goTab('treino')" id="nav-treino">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.5 6.5h11M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/><circle cx="12" cy="12" r="4"/></svg>
      <span class="nav-label">Treino</span>
    </button>
    <button class="nav-item" onclick="goTab('evolucao')" id="nav-evolucao">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>
      <span class="nav-label">Evolução</span>
    </button>
    <button class="nav-item" onclick="goTab('comp')" id="nav-comp">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>
      <span class="nav-label">Competição</span>
    </button>
    <button class="nav-item" onclick="goTab('ia')" id="nav-ia">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2a7 7 0 017 7c0 2.38-1.19 4.47-3 5.74V17a1 1 0 01-1 1H9a1 1 0 01-1-1v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 017-7z"/><path d="M9 21h6M10 17v4M14 17v4"/></svg>
      <span class="nav-label">IA</span>
    </button>
  </nav>

  <!-- BOTTOM SHEETS -->
  <div id="video-modal" class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div id="video-modal-content"></div>
  </div>
  <div id="register-modal" class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div id="register-modal-content"></div>

<script>

// APP STATE & STORAGE
// ============================================================
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

const DEFAULT_PROFILE = { nome:'Atleta', faixa:'Azul', peso:70, altura:175, idade:30,
  objetivo:'performance', apiKey:'', semana:1 };

const S = {
  tab: 'hoje',
  profile: load('jj:p') || null,
  sessions: load('jj:ss') || [],
  assessments: load('jj:av') || {},
  week: load('jj:sem') || 1,

  messages: load('jj:msg') || [],
  simActive: false, simRound: 0, simTimer: null, simSeconds: 0,
  pseRound: {},

  regPse: 5, regDur: 90, regTipo: 'JJ',
  analyzeState: 0, analyzeUrl: '',

};

// ============================================================
// HELPERS
// ============================================================
function getBeltGradient(b) {
  return ({
    'Branca':'linear-gradient(90deg,#e8e8e8,#b8b8c8)',
    'Azul':'linear-gradient(90deg,#3b82f6,#1d4ed8)',
    'Roxa':'linear-gradient(90deg,#7c3aed,#5b21b6)',
    'Marrom':'linear-gradient(90deg,#92400e,#78350f)',
    'Preta':'linear-gradient(90deg,#1a1a2e,#08080e)',
  })[b] || 'linear-gradient(90deg,#e8e8e8,#b8b8c8)';
}

function setBelt(b) {
  document.documentElement.style.setProperty('--belt-grad', getBeltGradient(b));
}

function calcACWR() {
  const loads = S.sessions.map(s => (s.pse||5) * (s.dur||60));
  if (!loads.length) return { acwr: null, acute: 0, chronic: 0 };
  const acute = loads.slice(-7).reduce((a,b)=>a+b,0)/7;
  const chronic = loads.slice(-28).reduce((a,b)=>a+b,0)/28;
  return { acwr: chronic>0 ? +(acute/chronic).toFixed(2) : null, acute, chronic };
}

function acwrColor(v) {
  if (!v) return '#4a4a5a';
  if (v < 0.8) return '#3b82f6';
  if (v <= 1.3) return '#4ade80';
  if (v <= 1.5) return '#fbbf24';
  return '#f87171';
}

function acwrLabel(v) {
  if (!v) return 'Sem dados suficientes';
  if (v < 0.8) return 'Subcarga — Pode progredir';
  if (v <= 1.3) return 'Zona segura — Continue';
  if (v <= 1.5) return 'Atenção — Monitore fadiga';
  return 'Alto risco — Reduza intensidade';
}

function calcFitScore() {
  const a = S.assessments;
  if (!Object.keys(a).length) return null;
  let score = 0, count = 0;
  const ref = {
    cooper: [2000,2400,2800],
    flexao: [20,30,40],
    abdominal: [25,35,45],
    salto: [30,40,50],
    preensao: [40,50,60]
  };
  for (const [k,v] of Object.entries(ref)) {
    const val = parseFloat(a[k]);
    if (!isNaN(val)) {
      const [poor,good,exc] = v;
      let pts = val < poor ? 20 : val < good ? 50 : val < exc ? 75 : 95;
      score += pts; count++;
    }
  }
  return count > 0 ? Math.round(score/count) : null;
}

function fitScoreClass(s) {
  if (s < 30) return 'Fraco';
  if (s < 50) return 'Regular';
  if (s < 70) return 'Bom';
  if (s < 85) return 'Muito Bom';
  return 'Excelente';
}

function dayOfWeekStr(d) {
  return ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d];
}

function todayType() {
  const d = new Date().getDay();
  // 0=Dom,1=Seg,2=Ter,3=Qua,4=Qui,5=Sex,6=Sáb
  // Academia: Seg/Qua/Sex → A/B/C
  // JJ: Ter/Qui/Sáb/Dom (4x semana)
  if (d===0) return 'JJ';
  if (d===1) return 'Academia A';
  if (d===2) return 'JJ';
  if (d===3) return 'Academia B';
  if (d===4) return 'JJ';
  if (d===5) return 'Academia C';
  if (d===6) return 'JJ';
  return 'Descanso';
}

function coachMessage() {
  const sem = S.week;
  const f = PERIODOS[sem-1] || PERIODOS[0];
  const msgs = [
    `Você está na <strong>semana ${sem} de 16</strong>, fase ${f.fase}. ${f.deload ? 'Semana de deload — recuperação é parte do treino.' : 'Mantenha a consistência — resultados vêm da soma dos dias.'}`,
    `Foco de JJ esta semana: <strong>${f.jj.foco}</strong>. Treinos de academia potencializam o que você pratica no tatame.`,
    `Lembre: ACWR ideal entre 0.8–1.3. Acima de 1.5 = risco de lesão. Registre suas sessões para monitorar.`,
    `Nutrição: <strong>${f.nutri}</strong>`,
    `${f.deload ? 'Semana de deload: menos é mais. O corpo adapta durante o descanso.' : 'Progressão gradual. Não tente fazer mais do que o programado — respeite o plano.'}`,
  ];
  return msgs[sem % msgs.length];
}

function weekDayType(dow) {
  // dow: 0=Dom,1=Seg,...
  if (dow===1) return {tipo:'Academia A', icon:'🏋️', color:'var(--gold)'};
  if (dow===2) return {tipo:'JJ', icon:'🥋', color:'var(--ember)'};
  if (dow===3) return {tipo:'Academia B', icon:'🏋️', color:'var(--gold)'};
  if (dow===4) return {tipo:'JJ', icon:'🥋', color:'var(--ember)'};
  if (dow===5) return {tipo:'Academia C', icon:'🏋️', color:'var(--gold)'};
  if (dow===6) return {tipo:'JJ', icon:'🥋', color:'var(--ember)'};
  return {tipo:'Descanso', icon:'—', color:'var(--text3)'};
}

function getWorkoutForDay(sem, dow) {
  const p = PERIODOS[(sem-1) % PERIODOS.length];
  if (dow===1) return {label:'Academia — Treino A', exs: p.academia.a, tipo:'academia'};
  if (dow===3) return {label:'Academia — Treino B', exs: p.academia.b, tipo:'academia'};
  if (dow===5) return {label:'Academia — Treino C', exs: p.academia.c, tipo:'academia'};
  if ([2,4,6,0].includes(dow)) return {label:'Jiu-Jítsu', tipo:'jj', jj:p.jj, cardio:p.cardio};
  return null;
}

function renderTreino() {
  const p2 = PERIODOS[(S.week-1)%PERIODOS.length];
  const pct = Math.round((S.week-1)/16*100);
  const days = [1,2,3,4,5,6,0]; // Mon..Sun
  const dayLetters = ['S','T','Q','Q','S','S','D'];
  const today = new Date().getDay();

  let dayStripHTML = days.map((d,i)=>{
    const wt = weekDayType(d);
    const isToday = d===today;
    const isSelected = S.daySelected===d;
    return `<button class="day-btn ${isSelected?'active':''}" onclick="selectDay(${d})">
      <span class="day-letter" style="${isToday?'color:var(--gold);':''}">${dayLetters[i]}</span>
      <span style="font-size:16px;">${wt.icon}</span>
      <span class="day-dot" style="${isSelected?'background:var(--gold)':''}"></span>

  if (!wk) {

          <div style="font-size:13px;color:var(--text2);line-height:1.6;">${p2.nutri}</div>
        </div>
      </div>`;
  } else {
    const exs = wk.exs || [];

}

function selectDay(d) {
  S.daySelected = d;
  renderTreino();
}

function renderEvolucao() {
  const fitScore = calcFitScore();
  const { acwr, acute, chronic } = calcACWR();
  const p = S.profile || DEFAULT_PROFILE;
  const fcmax = 220 - (p.idade||30);
  const zones = [
    {name:'Z1 Recuper.', pct:[50,60], color:'#3b82f6'},

    {name:'Z4 Anaeróbio', pct:[80,90], color:'#e55a2b'},

  const assessTests = [
    {id:'cooper', name:'Teste de Cooper', unit:'metros', desc:'Corra o máximo em 12 minutos. Registre a distância total em metros.', ref:[{label:'Fraco',val:'<2000',cls:'poor'},{label:'Regular',val:'2000-2399',cls:'reg'},{label:'Bom',val:'2400-2799',cls:'good'},{label:'Excelente',val:'>2800',cls:'exc'}], max:3200},
    {id:'flexao', name:'Flexão de Braço (1min)', unit:'reps', desc:'Máximo de repetições de flexão completas em 1 minuto.', ref:[{label:'Fraco',val:'<20',cls:'poor'},{label:'Regular',val:'20-29',cls:'reg'},{label:'Bom',val:'30-39',cls:'good'},{label:'Excelente',val:'>40',cls:'exc'}], max:60},
    {id:'abdominal', name:'Abdominal Supra (1min)', unit:'reps', desc:'Máximo de abdominais completos em 1 minuto.', ref:[{label:'Fraco',val:'<25',cls:'poor'},{label:'Regular',val:'25-34',cls:'reg'},{label:'Bom',val:'35-44',cls:'good'},{label:'Excelente',val:'>45',cls:'exc'}], max:70},
    {id:'salto', name:'Salto Vertical (CMJ)', unit:'cm', desc:'Salto máximo — mede a diferença entre alcance parado e no ar.', ref:[{label:'Fraco',val:'<30',cls:'poor'},{label:'Regular',val:'30-39',cls:'reg'},{label:'Bom',val:'40-49',cls:'good'},{label:'Excelente',val:'>50',cls:'exc'}], max:80},
    {id:'preensao', name:'Preensão Manual', unit:'kgf', desc:'Dinamômetro ou teste de aperto. Use a mão dominante.', ref:[{label:'Fraco',val:'<40',cls:'poor'},{label:'Regular',val:'40-49',cls:'reg'},{label:'Bom',val:'50-59',cls:'good'},{label:'Excelente',val:'>60',cls:'exc'}], max:80},
  ];

  // Build ACWR chart data
  const last28 = [];
  const now = new Date();
  for (let i=27;i>=0;i--) {
    const d = new Date(now); d.setDate(d.getDate()-i);
    const ds = d.toISOString().slice(0,10);
    const dayLoad = S.sessions.filter(s=>s.data.slice(0,10)===ds).reduce((a,s)=>a+(s.pse||5)*(s.dur||60),0);
    last28.push({label: d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}), load: dayLoad});
  }

  // SVG ring
  const score = fitScore || 0;
  const r = 80, cx = 100, cy = 100;
  const circ = 2*Math.PI*r;
  const offset = circ - (score/100)*circ;
  const scoreColor = score < 40 ? '#f87171' : score < 60 ? '#fbbf24' : score < 80 ? '#4ade80' : '#c8a96e';

  document.getElementById('sc-evolucao').innerHTML = `
    <div class="app-header">
      <div class="app-logo">JJ<span>Performance</span></div>
    </div>

    <div class="section-label">Score de Condicionamento</div>

      <div class="card-inner" style="display:flex;align-items:center;gap:16px;">

          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="16"/>
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${scoreColor}" stroke-width="16"
            stroke-dasharray="${circ}" stroke-dashoffset="${fitScore?offset:circ}"
            stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dashoffset 1s ease;"/>
          <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="38" font-weight="800" fill="var(--text)" font-family="Plus Jakarta Sans">${fitScore||'—'}</text>
          <text x="${cx}" y="${cy+28}" text-anchor="middle" font-size="13" fill="var(--text2)" font-family="Plus Jakarta Sans">${fitScore?fitScoreClass(fitScore):'Avaliar'}</text>
        </svg>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;margin-bottom:8px;">Fitness Score BJJ</div>
          ${assessTests.map(t=>{
            const v = parseFloat(S.assessments[t.id]);
            const pct = isNaN(v)?0:Math.min(v/t.max*100,100);
            return `<div style="margin-bottom:6px;">
              <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:2px;">
                <span>${t.name.split(' ')[0]}</span>
                <span style="color:var(--text)">${isNaN(v)?'—':v+' '+t.unit}</span>
              </div>
              <div class="result-bar-wrap"><div class="result-bar" style="width:${pct}%;background:${scoreColor};"></div></div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="section-label">Carga Semanal (ACWR)</div>
    <div class="card">
      <div class="card-inner">
        <canvas id="acwrChart" height="140"></canvas>
      </div>
    </div>

    <div class="section-label">Avaliação Física</div>
    ${assessTests.map(t=>`
      <div class="card">
        <div class="card-inner">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;">

              <div style="font-weight:700;font-size:14px;">${t.name}</div>
              <div style="font-size:12px;color:var(--text2);margin-top:2px;">${t.desc}</div>
            </div>
            <button class="btn-video" onclick="openVideoRef('${t.id}')">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>ver

          </div>
          <div class="assess-ref">
            ${t.ref.map(r=>`<div class="assess-col ${r.cls}"><div class="val">${r.val}</div>${r.label}</div>`).join('')}
          </div>
          <div style="display:flex;gap:8px;margin-top:10px;align-items:center;">
            <input type="number" placeholder="Resultado (${t.unit})" value="${S.assessments[t.id]||''}"
              onchange="S.assessments['${t.id}']=this.value;save('jj:av',S.assessments);renderEvolucao();"
              style="flex:1;" />
            ${S.assessments[t.id]?`<span class="badge badge-gold">${S.assessments[t.id]} ${t.unit}</span>`:''}
          </div>
        </div>
      </div>
    `).join('')}

        <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">

        ${zones.map(z=>`<div class="zone-row">

let simInterval = null;
function startSim() {
  S.simRound=1; S.simActive=true; S.simSeconds=5*60; S.simPhase='round'; S.pseRound={};
  simInterval = setInterval(simTick, 1000);
  updateSimUI();
}
function toggleSim() {
  S.simActive = !S.simActive;
  if (S.simActive) simInterval = setInterval(simTick, 1000);
  else { clearInterval(simInterval); simInterval=null; }
  updateSimUI();
}
function stopSim() {
  clearInterval(simInterval); simInterval=null;
  S.simActive=false; S.simRound=0; S.simSeconds=0; S.simPhase='';
  updateSimUI();
}
function setPseRound(n) {
  S.pseRound[S.simRound]=n;
  S.sessions.push({data:new Date().toISOString(),pse:n,dur:5,tipo:'Competição Round '+S.simRound});
  save('jj:ss',S.sessions);
  // continue to next round
  S.simRound++; S.simPhase='rest'; S.simSeconds=80; S.simActive=true;
  simInterval = setInterval(simTick,1000);
  updateSimUI();
}
function simTick() {
  if (!S.simActive) return;
  S.simSeconds--;
  if (S.simSeconds<=0) {
    if (S.simPhase==='round') {
      clearInterval(simInterval); simInterval=null;
      S.simActive=false;
      S.simPhase='pse';
    } else if (S.simPhase==='rest') {
      if (S.simRound>6) { stopSim(); return; }
      S.simPhase='round'; S.simSeconds=5*60;
    }
  }
  updateSimUI();
}
function updateSimUI() {
  const sc = document.getElementById('sim-content');
  if (sc) sc.innerHTML = renderSimContent();
}

function localCoachReply(text) {
  const t = (text||'').toLowerCase();
  const sem = S.week;
  const fase = PERIODOS[(sem-1)%PERIODOS.length] || PERIODOS[0];
  const { acwr } = calcACWR();
  const fitScore = calcFitScore();

  if (/carga|acwr|fadiga|cansad|overtrain|les[aã]o/.test(t)) {
    if (acwr == null) return 'Ainda não tenho sessões suficientes registradas para calcular seu ACWR (carga aguda/crônica). Registre seus treinos na aba Hoje para eu acompanhar sua carga.';
    return `Seu ACWR atual é <strong>${acwr}</strong> — ${acwrLabel(acwr)}. A faixa ideal é 0.8–1.3; acima de 1.5 o risco de lesão sobe bastante. ${fase.deload ? 'Você está numa semana de deload, então reduzir o volume agora é esperado e recomendado.' : 'Continue registrando suas sessões para eu acompanhar a tendência.'}`;
  }
  if (/sono|dormi|recupera|descans/.test(t)) {
    return `Na fase atual (<strong>${fase.fase}</strong>, semana ${sem}/16), a orientação de recuperação é: ${fase.nutri} ${fase.deload ? 'Essa é uma semana de deload — priorize sono e descanso ativo.' : ''}`;
  }
  if (/nutri|aliment|dieta|com(er|ida)|prote[ií]na|carbo/.test(t)) {
    return `Nutrição recomendada para a semana ${sem} (${fase.fase}): ${fase.nutri}`;
  }
  if (/t[eé]cnic|guarda|passagem|finaliza|chave|tri[aâ]ngulo|raspagem/.test(t)) {
    return `O foco técnico desta semana é: <strong>${fase.jj.foco}</strong> (intensidade ${fase.jj.intensidade}). Aproveite os treinos de JJ (Ter/Qui/Sáb/Dom) para repetir essas posições com atenção aos detalhes.`;
  }
  if (/compet|campeonato|torneio|pront/.test(t)) {
    const scoreTxt = fitScore!=null ? `Seu índice físico atual é ${fitScore}/100 (${fitScoreClass(fitScore)}).` : 'Você ainda não registrou os testes físicos na aba Evolução — faça-os para eu avaliar sua prontidão.';
    const acwrTxt = acwr!=null ? `Sua carga (ACWR ${acwr}) está em: ${acwrLabel(acwr).toLowerCase()}.` : '';
    return `${scoreTxt} ${acwrTxt} Você está na semana ${sem}/16 do programa — ${sem>12 ? 'fase final, ajuste o pico para a competição.' : 'ainda há tempo para construir base antes de picos de competição.'}`;
  }
  if (/motiva|desanima|desist|ansio/.test(t)) {
    return 'A consistência vale mais que a intensidade de um dia só. Cada treino, mesmo os ruins, soma na sua evolução de faixa. Confie no processo de 16 semanas e celebre as pequenas vitórias no tatame.';
  }
  return `Sou o coach local (grátis, offline) — baseio minhas respostas nos seus dados registrados e na ciência do treinamento. Posso comentar sua <strong>carga/ACWR</strong>, <strong>sono/recuperação</strong>, <strong>nutrição</strong>, <strong>foco técnico</strong> da semana ou sua <strong>prontidão para competir</strong>. Pergunte sobre um desses temas — ou configure uma chave Anthropic nas Configurações para respostas mais livres.`;
}

function localVideoPlan() {
  const sem = S.week;
  const fase = PERIODOS[(sem-1)%PERIODOS.length] || PERIODOS[0];
  return `Modo local (sem chave de API): não consigo "assistir" o vídeo, mas aqui está um plano de estudo baseado na sua semana atual (${sem}/16, fase ${fase.fase}):

<strong>Foco técnico da semana:</strong> ${fase.jj.foco}

<strong>Plano de treino de 3 dias:</strong><br>
Dia 1 — Drill posicional: 5x2min no foco da semana (${fase.jj.foco}), intensidade ${fase.jj.intensidade}.<br>
Dia 2 — Situação de luta iniciando na posição trabalhada, 5 rounds de 4min.<br>
Dia 3 — Revisão com parceiro: ensine a posição a alguém (consolidação) + 3 rounds livres aplicando o detalhe.

<strong>Dica:</strong> grave seus próprios rounds e compare com o vídeo de referência — observe entradas, grips e timing. Para análise automática do conteúdo do vídeo, configure uma chave Anthropic nas Configurações.`;
}

async function callAI(messages) {
  const key = (S.profile||{}).apiKey;
  if (!key) return localCoachReply(messages[messages.length-1]?.content || '');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'x-api-key':key,
        'anthropic-version':'2023-06-01',
        'content-type':'application/json',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1024,
        system: buildSystem(),
        messages
      })
    });
    const data = await res.json();
    if (data.error) return `Erro API: ${data.error.message}`;
    return data.content?.find(c=>c.type==='text')?.text || 'Sem resposta.';
  } catch(e) {
    return `Erro de conexão: ${e.message}`;
  }
}

function saveProfile() {
  const nome = document.getElementById('p-nome')?.value?.trim() || 'Atleta';
  const idade = parseInt(document.getElementById('p-idade')?.value) || 30;
  const peso = parseFloat(document.getElementById('p-peso')?.value) || 70;
  const altura = parseFloat(document.getElementById('p-altura')?.value) || 175;
  const faixa = document.getElementById('p-faixa')?.value || 'Azul';
  const objetivo = document.getElementById('p-obj')?.value || 'performance';
  const apiKey = document.getElementById('p-api')?.value || '';
  S.profile = { nome, idade, peso, altura, faixa, objetivo, apiKey };
  save('jj:p', S.profile);
  setBelt(faixa);
  document.getElementById('profile-modal').style.display = 'none';
  goTab('hoje');
}

// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', ()=>{
  if (!S.profile) {
    document.getElementById('profile-modal').style.display = 'flex';
  } else {
    setBelt(S.profile.faixa);
    goTab('hoje');
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});

}
